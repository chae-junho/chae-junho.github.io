<section class="hero" data-lang="en">
<div class="lang-switch">
<span class="lang-switch__icon" aria-hidden="true"><i class="fas fa-language"></i></span>
<div class="lang-switch__group" role="group" aria-label="Language">
<button type="button" data-lang="en" aria-pressed="true">EN</button>
<button type="button" data-lang="ko" aria-pressed="false">한국어</button>
<button type="button" data-lang="zh" aria-pressed="false">中文</button>
</div>
</div>
<div class="hero__text i18n i18n--en" lang="en">
{% include intro-en.html %}
</div>
<div class="hero__text i18n i18n--ko" lang="ko">
{% include intro-ko.html %}
</div>
<div class="hero__text i18n i18n--zh" lang="zh">
{% include intro-zh.html %}
</div>
</section>
<script>
(function () {
  var hero = document.querySelector('.hero');
  if (!hero) { return; }
  var buttons = hero.querySelectorAll('.lang-switch button');
  var codes = ['en', 'ko', 'zh'];
  // The fill of the language that is picked is a block under the buttons that slides to the next one.
  var group = hero.querySelector('.lang-switch__group');
  var thumb = document.createElement('span');
  thumb.className = 'lang-switch__thumb';
  thumb.setAttribute('aria-hidden', 'true');
  group.insertBefore(thumb, group.firstChild);
  var placed = false;
  function slide() {
    var on = group.querySelector('button[aria-pressed="true"]');
    if (!on || !on.offsetWidth) { return; }
    if (!placed) { thumb.style.transition = 'none'; group.classList.add('lang-switch--slide'); }
    thumb.style.width = on.offsetWidth + 'px';
    thumb.style.height = on.offsetHeight + 'px';
    thumb.style.transform = 'translate(' + on.offsetLeft + 'px, ' + on.offsetTop + 'px)';
    if (!placed) { void thumb.offsetWidth; thumb.style.transition = ''; placed = true; }
  }
  function show(code) {
    hero.setAttribute('data-lang', code);
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute('aria-pressed', buttons[i].getAttribute('data-lang') === code ? 'true' : 'false');
    }
    slide();
  }
  window.addEventListener('resize', slide);
  window.addEventListener('load', slide);
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(slide); }
  var saved = null;
  try { saved = window.localStorage.getItem('hero-lang'); } catch (e) {}
  var browser = String((navigator.languages && navigator.languages[0]) || navigator.language || 'en').toLowerCase();
  var guess = browser.indexOf('ko') === 0 ? 'ko' : (browser.indexOf('zh') === 0 ? 'zh' : 'en');
  show(codes.indexOf(saved) >= 0 ? saved : guess);
  for (var j = 0; j < buttons.length; j++) {
    buttons[j].addEventListener('click', function () {
      var code = this.getAttribute('data-lang');
      show(code);
      if (window.__reveal) { window.__reveal.openingText(); }
      try { window.localStorage.setItem('hero-lang', code); } catch (e) {}
    });
  }
})();
</script>
