<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="#about-me" target="_self" onclick="var t=document.getElementById('about-me');if(t){t.scrollIntoView();return false}">Homepage</a></li>
          {%- for link in site.data.navigation.main %}
          {%- assign section = link.url | remove: "#" %}
          <li class="masthead__menu-item"><a href="{{ link.url }}" target="_self" onclick="var t=document.getElementById('{{ section }}');if(t){t.scrollIntoView();return false}">{{ link.title }}</a></li>
          {%- endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
