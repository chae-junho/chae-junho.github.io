{%- assign groups = site.data.honors | group_by: "degree" -%}
<ul class="pub-list pub-list--grid pub-list--honors">
{%- for g in groups %}
<li><span class="pub-badge pub-badge--degree">{{ g.name }}</span><div class="pub__body">{% for h in g.items %}<span class="pub-tag pub-tag--honor{% if h.bold %} is-bold{% endif %}">{{ h.name }}{% if h.times %} ×{{ h.times }}{% endif %}{% if h.rank %}, {{ h.rank }}{% endif %}</span> {% endfor %}</div></li>
{%- endfor %}
</ul>
