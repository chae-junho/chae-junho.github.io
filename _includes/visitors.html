{%- if site.visitor_globe_url -%}
<div class="visitors-end">
<div class="visitors" data-widget="{{ site.visitor_globe_url }}"{% if site.visit_log_url %} data-visits="{% if site.visit_proxy_url %}{{ site.visit_proxy_url }} {% endif %}{{ site.visit_log_url }}"{% if site.visit_live_url %} data-live="{{ site.visit_live_url }}"{% endif %}{% endif %}>
<span class="visitors__size" aria-hidden="true"></span>
<div class="globe-global-container"></div>
<p class="visitors__caption">Where visitors come from</p>
</div>
</div>
{%- endif -%}
