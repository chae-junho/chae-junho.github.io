<ul class="pub-list pub-list--grid pub-list--skills">
{%- for s in site.data.skills %}
<li><span class="pub-badge">{{ s.name }}</span><div class="pub__body">{% if s.tags %}{{ s.tags | join: ", " }}{% if s.suffix %}, {{ s.suffix }}{% endif %}{% endif %}{% for i in s.items %}<span class="pub__line">{{ i }}</span>{% endfor %}</div></li>
{%- endfor %}
</ul>
