<script>
// The links in the top bar. Following one scrolls to its section with the browser's own smooth scrolling. The theme has a
// script of its own that animates the same scroll, and two animations at once made the page stutter and left the
// section title under the top bar, so this handler takes the click first. The link of the section you are reading is
// marked (.is-current; the underline is set in _sass/_custom.scss). The link you click is marked at once and stays marked
// until you scroll yourself, so the mark does not run through the links in between, and the last sections, which cannot
// scroll up to the top of the window, keep the mark of the link you clicked.
(function () {
  var nav = document.getElementById('site-nav');
  if (!nav) { return; }
  var links = {}, ids = [], locked = false, waiting = false;
  var anchors = nav.querySelectorAll('a[href*="#"]');
  for (var i = 0; i < anchors.length; i++) {
    var id = anchors[i].getAttribute('href').split('#')[1];
    if (id && document.getElementById(id) && !anchors[i].closest('.masthead__menu-home-item')) { links[id] = anchors[i]; ids.push(id); }
  }
  if (!ids.length) { return; }

  // The glass of the bar is a layer under the row of links, as wide and as high as the row (the theme's menu script counts
  // the items of the list, so the layer cannot be inside it). The lens around the current link slides from one link to the
  // next on the spring, and a soft light follows the pointer (see _sass/_custom.scss). All of it is placed from the
  // position of the row and of the link, and placed again when they change (the fonts arrive, the window changes).
  //
  // In a window that is too narrow for all the links the theme puts the last ones into the menu of the three bars. Then the
  // bar turns pages instead: all the links are split into rows (.nav-page) that each fit beside the button, whatever the
  // width of the window, and the bar shows the row that holds the section you read, with the lens round its link. When you
  // read on into the links of the next row, that row comes in from the right and the old one goes out to the left, and the
  // other way round on the way back; the glass takes the width of the new row. The menu of the three bars is still there.
  var list = nav.querySelector('.visible-links');
  var menu = nav.querySelector('.hidden-links');
  var button = nav.querySelector('button');
  var glass = document.createElement('span');
  glass.className = 'nav-glass';
  glass.setAttribute('aria-hidden', 'true');
  var light = document.createElement('span');
  light.className = 'nav-light';
  var line = document.createElement('span');
  line.className = 'nav-indicator';
  glass.appendChild(light);
  nav.insertBefore(glass, nav.firstChild);
  nav.insertBefore(line, list);
  var placed = false;
  var pages = [];
  var builtFor = '';
  var lastRow = -1;

  // every link, in order: the links of the bar (not the name at its left), then the ones of the menu
  function allLinks() {
    var out = [];
    [list, menu].forEach(function (ul) {
      if (!ul) { return; }
      [].forEach.call(ul.children, function (li) {
        var a = li.querySelector('a');
        if (a && !li.classList.contains('masthead__menu-home-item')) { out.push({ li: li, a: a, id: (a.getAttribute('href') || '').split('#')[1] }); }
      });
    });
    return out;
  }

  function copyOf(li) {
    var copy = li.cloneNode(true);
    var link = copy.querySelector('a');
    if (link) { link.classList.remove('is-current'); }
    return copy;
  }

  // splits the links into rows that fit; rebuilt when the width of the bar changes
  function buildPages() {
    var items = allLinks();
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    var room = nav.getBoundingClientRect().width - (button ? button.getBoundingClientRect().width : 0) - 0.8 * rem - 3 * rem;
    // measure the links in a row that is not shown (the key includes their widths, so the rows are made again when the web font
    // arrives and the links change their width)
    var probe = document.createElement('ul');
    probe.className = 'nav-page nav-probe';
    items.forEach(function (it) { probe.appendChild(copyOf(it.li)); });
    nav.appendChild(probe);
    var widths = [].map.call(probe.querySelectorAll('a'), function (a) { return a.getBoundingClientRect().width; });
    nav.removeChild(probe);
    var key = items.length + ':' + Math.round(room) + ':' + Math.round(rem) + ':' + Math.round(widths.reduce(function (a, b) { return a + b; }, 0));
    if (key === builtFor) { return; }
    builtFor = key;
    var groups = [], current = [], used = 0;
    items.forEach(function (it, i) {
      var need = current.length ? used + 2 * rem + widths[i] : widths[i];
      if (current.length && need > room) { groups.push(current); current = []; need = widths[i]; }
      current.push(i);
      used = need;
    });
    if (current.length) { groups.push(current); }
    pages.forEach(function (page) { nav.removeChild(page.el); });
    pages = groups.map(function (group) {
      var ul = document.createElement('ul');
      ul.className = 'nav-page';
      group.forEach(function (i) { ul.appendChild(copyOf(items[i].li)); });
      nav.appendChild(ul);
      return { el: ul, ids: group.map(function (i) { return items[i].id; }) };
    });
    markCurrent();
  }

  // the section you read, as the id of its link
  function currentId() {
    var now = nav.querySelector('.visible-links a.is-current, .hidden-links a.is-current');
    return now ? now.getAttribute('href').split('#')[1] : null;
  }

  function markCurrent() {
    var id = currentId();
    for (var p = 0; p < pages.length; p++) {
      var copies = pages[p].el.querySelectorAll('a');
      for (var c = 0; c < copies.length; c++) {
        copies[c].classList.toggle('is-current', !!id && copies[c].getAttribute('href').split('#')[1] === id);
      }
    }
  }

  // A row that is coming in or going out is shifted sideways by its transition. The glass and the lens go to where the row
  // comes to rest, so the shift of the row (the first number of its transform matrix) is taken off what is measured.
  function shift(el) {
    var m = getComputedStyle(el).transform.match(/matrix\(([^)]+)\)/);
    return m ? (parseFloat(m[1].split(',')[4]) || 0) : 0;
  }

  // measure is true when the window, the fonts or the links have changed (the rows are measured and made again then); the
  // scroll-spy calls this without it, many times a second, and must not touch the layout of the page more than it has to
  function moveLine(measure) {
    var n = nav.getBoundingClientRect();
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    // the bar turns pages when the theme has put links into the menu (its button is shown)
    var paging = !!(button && button.offsetParent);
    if (paging && (measure || !pages.length)) { buildPages(); }
    paging = paging && pages.length > 1;
    var id = currentId();
    var at = 0;
    for (var p = 0; p < pages.length; p++) { if (id && pages[p].ids.indexOf(id) >= 0) { at = p; } }
    nav.classList.toggle('is-paged', paging);
    for (var q = 0; q < pages.length; q++) {
      pages[q].el.classList.toggle('is-active', paging && q === at);
      pages[q].el.classList.toggle('is-before', paging && q < at);
      pages[q].el.classList.toggle('is-after', paging && q > at);
    }
    var row = paging ? pages[at].el : list;
    var rowShift = shift(row);
    var u = row.getBoundingClientRect();
    glass.style.left = (u.left - rowShift - n.left) + 'px';
    glass.style.top = (u.top - n.top) + 'px';
    glass.style.width = u.width + 'px';
    glass.style.height = u.height + 'px';
    var target = paging ? pages[at].el.querySelector('a.is-current') : nav.querySelector('.visible-links a.is-current');
    if (!target || !target.offsetParent && !paging) { line.style.opacity = '0'; glass.classList.add('is-placed'); return; }
    var r = target.getBoundingClientRect(), padX = 0.75 * rem;
    var x = r.left - rowShift - n.left - padX, y = r.top - n.top, w = r.width + 2 * padX, h = r.height;
    // The lens glides from link to link on the same row. When the bar turns to another row it does not glide across (that would
    // take it over links that are going out), it is put down at its new place at once and fades in there.
    var turned = placed && paging && at !== lastRow;
    if (!placed) { line.style.transition = 'none'; glass.style.transition = 'none'; }
    if (turned) { line.style.transition = 'none'; line.style.opacity = '0'; }
    line.style.width = w + 'px';
    line.style.height = h + 'px';
    // (the property translate, not transform: the swell of the lens uses scale, which would scale a translation in transform too)
    line.style.translate = x + 'px ' + y + 'px';
    if (turned) { void line.offsetWidth; line.style.transition = ''; }
    line.style.opacity = '1';
    if (!placed) { void line.offsetWidth; line.style.transition = ''; glass.style.transition = ''; placed = true; }
    lastRow = paging ? at : -1;
    glass.classList.add('is-placed');
  }
  window.addEventListener('resize', function () {
    // while the window is being resized the glass follows at once and does not take the spring
    glass.style.transition = 'none';
    setTimeout(function () { moveLine(true); void glass.offsetWidth; glass.style.transition = ''; }, 150);
  });
  window.addEventListener('load', moveLine);
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(moveLine); }
  if (window.ResizeObserver) { var barWatch = new ResizeObserver(moveLine); barWatch.observe(list); barWatch.observe(nav); }

  // A soft light follows the pointer over the glass of the bar (--mx and --my in _sass/_custom.scss).
  var lightFrame = 0, lightX = 0, lightY = 0;
  nav.addEventListener('pointermove', function (e) {
    var box = glass.getBoundingClientRect();
    lightX = e.clientX - box.left;
    lightY = e.clientY - box.top;
    glass.classList.add('is-lit');
    if (!lightFrame) {
      lightFrame = window.requestAnimationFrame(function () {
        lightFrame = 0;
        glass.style.setProperty('--mx', lightX + 'px');
        glass.style.setProperty('--my', lightY + 'px');
      });
    }
  });
  nav.addEventListener('pointerleave', function () { glass.classList.remove('is-lit'); });

  // whether the last thing the visitor used was a pointer or the keyboard (the ring of the keyboard is not shown after a click)
  window.addEventListener('pointerdown', function () { document.documentElement.classList.add('using-pointer'); }, true);
  window.addEventListener('keydown', function (e) { if (e.key === 'Tab') { document.documentElement.classList.remove('using-pointer'); } }, true);

  var shownId = null;
  function setCurrent(current) {
    // nothing to do while it is the same section (this is called on every frame of a scroll)
    if (current === shownId) { return; }
    shownId = current;
    for (var k = 0; k < ids.length; k++) {
      if (ids[k] === current) { links[ids[k]].classList.add('is-current'); }
      else { links[ids[k]].classList.remove('is-current'); }
    }
    markCurrent();
    moveLine();
  }

  function update() {
    waiting = false;
    if (locked) { return; }
    var bar = document.querySelector('.masthead');
    var barBottom = bar ? bar.getBoundingClientRect().bottom : 0;
    var room = window.innerHeight - barBottom;
    // a section counts as reached when its title is above a line a quarter of the way down the window; near the end of the
    // page the line moves down to the bottom, so that the last sections can be reached by scrolling
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var ratio = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
    var line = barBottom + room * (0.25 + 0.75 * Math.pow(ratio, 8));
    var current = ids[0];
    for (var j = 0; j < ids.length; j++) {
      if (document.getElementById(ids[j]).getBoundingClientRect().top <= line) { current = ids[j]; }
    }
    setCurrent(current);
  }

  function schedule() {
    if (!waiting) { waiting = true; window.requestAnimationFrame(update); }
  }

  document.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) { return; }
    var a = e.target.closest ? e.target.closest('a[href*="#"]') : null;
    if (!a) { return; }
    var url;
    try { url = new URL(a.href, location.href); } catch (err) { return; }
    var here = location.pathname.replace(/index\.html$/, '');
    if (url.origin !== location.origin || url.pathname.replace(/index\.html$/, '') !== here || url.hash.length < 2) { return; }
    var target = document.getElementById(decodeURIComponent(url.hash.slice(1)));
    if (!target) { return; }
    e.preventDefault();
    e.stopImmediatePropagation();
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    target.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
    if (window.__reveal) { window.__reveal.arrive(target, a.getBoundingClientRect()); }
    if (history.pushState && location.hash !== url.hash) {
      // inside a frame (the page at junhaocai.github.io) the back button belongs to the outer page, so the address is replaced, not added
      if (window.top !== window.self) { history.replaceState(null, '', url.hash); } else { history.pushState(null, '', url.hash); }
    }
    var id = url.hash.slice(1);
    if (links[id]) { locked = true; setCurrent(id); }
    // a link in the menu of a narrow window: close the menu
    var button = document.querySelector('.greedy-nav button');
    if (a.closest('.hidden-links') && button && button.classList.contains('close')) { button.click(); }
  }, true);

  // A click in the body of a section marks the link of that section in the bar, and the mark is held until you scroll yourself,
  // as it is after a click on the link. The section is the one whose title stands above the place that was clicked (what comes
  // before the first title is the opening text, which belongs to the first link).
  document.addEventListener('click', function (e) {
    if (e.button !== 0) { return; }
    var content = document.querySelector('.page__content');
    if (!content || !e.target.closest || !e.target.closest('.page__content')) { return; }
    var child = e.target;
    while (child && child.parentElement !== content) { child = child.parentElement; }
    if (!child) { return; }
    var heading = child;
    while (heading && !(heading.matches && heading.matches('h1[id]'))) { heading = heading.previousElementSibling; }
    var id = heading ? heading.id : ids[0];
    if (links[id]) { locked = true; setCurrent(id); }
  });

  // scrolling by yourself ends the hold on the mark
  ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(function (name) {
    window.addEventListener(name, function (ev) {
      if (!locked) { return; }
      if (name === 'mousedown' && ev.target.closest && ev.target.closest('#site-nav')) { return; }
      locked = false;
      schedule();
    }, { passive: true });
  });

  window.addEventListener('scroll', schedule, { passive: true });
  window.addEventListener('resize', schedule);
  update();
})();
</script>

<script>
// The line under the top bar shows once the page has moved (the class is used in _sass/_custom.scss).
(function () {
  var root = document.documentElement, on = false;
  function check() {
    var now = window.scrollY > 4;
    if (now !== on) { on = now; root.classList.toggle('is-scrolled', on); }
  }
  window.addEventListener('scroll', check, { passive: true });
  check();
})();
</script>

<script>
// Parts of the page rise a little and fade in, once, as they come into view; several that come together follow one
// another. What takes part is listed in _sass/_custom.scss (--reveal-targets), the same list that hides them. Without
// this script (or without IntersectionObserver, or when the visitor wants less motion) the class that hides them is
// not set at all, or is taken off by the script in the head.
(function () {
  var root = document.documentElement;
  if (!/\bjs-reveal\b/.test(root.className) || !('IntersectionObserver' in window)) { return; }
  var list = getComputedStyle(root).getPropertyValue('--reveal-targets');
  if (!list || !list.trim()) { root.className = root.className.replace(/\bjs-reveal\b/g, ''); return; }
  var items = document.querySelectorAll(list);

  // shows a group of elements one after another, in the order of the page; the cells of one row (badge and text) come
  // together, and the rows follow one another
  function showInOrder(batch) {
    batch.sort(function (a, b) { return a.compareDocumentPosition(b) & 4 ? -1 : 1; });
    // (the profile card and the text count their steps apart, so that they come in side by side)
    var steps = { side: -1, main: -1 }, last = { side: null, main: null };
    for (var j = 0; j < batch.length; j++) {
      var region = batch[j].closest('.sidebar') ? 'side' : 'main';
      var parent = batch[j].parentElement;
      var row = parent && getComputedStyle(parent).display === 'contents' ? parent : batch[j];
      if (row !== last[region]) { steps[region]++; last[region] = row; }
      batch[j].style.setProperty('--d', Math.min(steps[region], 9) * 80 + 'ms');
      batch[j].classList.add('is-in');
    }
  }

  // puts an element back to where it is before it appears, without a movement
  function hideNow(el) {
    el.style.transition = 'none';
    el.classList.remove('is-in');
    void el.offsetWidth;
    el.style.transition = '';
  }

  // While the page travels to the section of a link of the bar nothing comes in on the way (the page has enough to do then:
  // the scroll, the glass of the bar over it); when it has arrived, whatever is in the window comes in, in one pass.
  var quiet = false;
  var seen = new IntersectionObserver(function (entries) {
    if (quiet) { return; }
    var batch = [];
    for (var i = 0; i < entries.length; i++) { if (entries[i].isIntersecting) { batch.push(entries[i].target); seen.unobserve(entries[i].target); } }
    showInOrder(batch);
  }, { rootMargin: '0px', threshold: 0.01 });
  for (var k = 0; k < items.length; k++) { seen.observe(items[k]); }
  // Whatever is in the window and has not come in yet comes in. It is used when a jump has ended and at the end of the page: the
  // last rows of the page cannot be scrolled up into the middle of the window, so they never reach the margin of the observer.
  function revealVisible() {
    var vh = window.innerHeight;
    var now = [].filter.call(items, function (el) {
      if (el.classList.contains('is-in') || el.offsetParent === null) { return false; }
      var b = el.getBoundingClientRect();
      return b.top < vh && b.bottom > 0;
    });
    if (now.length) { now.forEach(function (el) { seen.unobserve(el); }); showInOrder(now); }
  }
  function showWhatIsLeft() {
    if (quiet || window.innerHeight + window.scrollY < document.documentElement.scrollHeight - 4) { return; }
    revealVisible();
  }
  window.addEventListener('scroll', showWhatIsLeft, { passive: true });
  window.addEventListener('resize', showWhatIsLeft);

  // The entrance is not only for the first time. A click that brings something new (another language, a section of the
  // bar) plays it again, every time: the language switch replays the opening text, and a link of the bar replays the
  // section it goes to, when the page has arrived there.
  function visibleOpeningText() {
    return [].filter.call(items, function (el) { return el.matches('.hero .hero__text > p') && el.offsetParent !== null; });
  }

  function sectionOf(target) {
    if (!target.matches || !target.matches('.page__content > h1')) { return visibleOpeningText(); }
    var h1s = document.querySelectorAll('.page__content > h1'), next = null;
    for (var i = 0; i < h1s.length - 1; i++) { if (h1s[i] === target) { next = h1s[i + 1]; } }
    return [].filter.call(items, function (el) {
      var after = el === target || (target.compareDocumentPosition(el) & 4);
      var before = !next || (next.compareDocumentPosition(el) & 2);
      return after && before;
    });
  }

  // The band behind a section (.section-glow in _sass/_custom.scss) shows how far the section reaches: from the top of its
  // title to the bottom of its last row, over the width of the text. It stays where it is, quite still, for as long as the
  // section is in the window (a long section on a phone is seen by scrolling through it), and goes, without a movement, when
  // you have scrolled away from it or follow another link. It follows the section when the window changes size.
  var band = null, wave = null, following = null, bandFrame = 0;

  // How far the entrance has moved an element down from where it rests (the second number of the translation in its transform).
  // A section that has not appeared yet is shifted down by that, and what is measured is taken back to where it will rest, so
  // that the band is the same before and after the section has come in.
  function lift(el) {
    var m = getComputedStyle(el).transform.match(/matrix\(([^)]+)\)/);
    return m ? (parseFloat(m[1].split(',')[5]) || 0) : 0;
  }

  function rangeOf(target, els) {
    var top = Infinity, bottom = -Infinity;
    var group = els.slice();
    if (!target.matches || !target.matches('.page__content > h1')) { var lang = document.querySelector('.hero .lang-switch'); if (lang) { group.push(lang); } }
    group.forEach(function (el) {
      var r;
      if (el.matches && el.matches('h1')) {
        // the theme puts an empty block, 41px high, in front of every title (so that a jump to it leaves room for the bar), which
        // makes the box of the title taller than its text; the band starts at the text
        var text = document.createRange();
        text.selectNodeContents(el);
        r = text.getBoundingClientRect();
      } else {
        r = el.getBoundingClientRect();
      }
      var down = lift(el);
      if (r.height > 0) { top = Math.min(top, r.top - down); bottom = Math.max(bottom, r.bottom - down); }
    });

    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    return { top: top - 0.9 * rem, bottom: bottom + 0.8 * rem };
  }

  // The numbers of the band are read from the layout once, when it starts and after a resize, and kept in the coordinates of the
  // document, so that following the scroll afterwards needs no reading of the layout at all.
  function measureBand() {
    var content = document.querySelector('.page__content');
    var r = following && rangeOf(following.target, following.els);
    if (!content || !r) { return false; }
    var box = content.getBoundingClientRect();
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    var bar = document.querySelector('.masthead');
    following.top = r.top + window.scrollY;
    following.bottom = r.bottom + window.scrollY;
    following.contentTop = box.top + window.scrollY;
    following.left = box.left - 0.9 * rem;
    following.width = box.width + 1.8 * rem;
    following.barBottom = bar ? bar.getBoundingClientRect().bottom : 0;
    following.dirty = false;
    return true;
  }

  function placeBand() {
    band.style.top = (following.top - following.contentTop) + 'px';
    band.style.height = (following.bottom - following.top) + 'px';
  }

  // The band is taken away only when it is out of sight (you have scrolled away from the section, or you follow another link),
  // and then at once and without any movement: a thing that fades while you read draws the eye away from the text.
  function endBand() {
    if (following && following.timer) { clearTimeout(following.timer); }
    following = null;
    if (band) {
      band.style.transition = 'none';
      band.classList.remove('is-on');
      void band.offsetWidth;
      band.style.transition = '';
    }

  function checkBand() {
    bandFrame = 0;
    if (!following) { return; }
    if (following.dirty) {
      if (!measureBand()) { return endBand(); }
      placeBand();
    }
    var vh = window.innerHeight, y = window.scrollY;
    var top = following.top - y, bottom = following.bottom - y, barBottom = following.barBottom;
    if (top >= barBottom - 4 && top <= vh) { following.sawTop = true; }
    if (bottom <= vh + 4 && bottom >= barBottom) { following.sawBottom = true; }
    var inView = bottom > barBottom && top < vh;

    else if (Date.now() - following.away > 600) { return endBand(); }
  }

  function scheduleBand() {
    if (following && !bandFrame) { bandFrame = window.requestAnimationFrame(checkBand); }
  }
  window.addEventListener('scroll', scheduleBand, { passive: true });
  window.addEventListener('resize', function () { if (following) { following.dirty = true; } scheduleBand(); });

  // origin is the box of the link that was clicked, as it was at the click. The band appears as a wave that goes out from the
  // middle of that link: a circle (.section-glow__wave) round that point, big enough to reach the farthest corner of the
  // band, which grows from nothing and is cut off by the band. It only grows (transform), which the graphics processor does by
  // itself, so that it is smooth even when the page has other things to do.
  function outline(target, els, origin) {
    var content = document.querySelector('.page__content');
    if (!content) { return; }
    if (!band) {
      band = document.createElement('span');
      band.className = 'section-glow';
      band.setAttribute('aria-hidden', 'true');
      wave = document.createElement('span');
      wave.className = 'section-glow__wave';
      band.appendChild(wave);
      content.insertBefore(band, content.firstChild);
    }
    if (following && following.timer) { clearTimeout(following.timer); }
    following = { target: target, els: els, sawTop: false, sawBottom: false, away: 0, timer: 0, dirty: false };
    // start again from nothing, whatever state the band was in
    band.style.transition = 'none';
    wave.style.transition = 'none';
    band.classList.remove('is-on');
    if (!measureBand()) { following = null; return; }
    placeBand();
    var from = origin && origin.width > 0 ? origin : null;
    var height = following.bottom - following.top;
    var ox = (from ? from.left + from.width / 2 : following.left + following.width / 2) - following.left;
    var oy = (from ? from.top + from.height / 2 : following.barBottom) - (following.top - window.scrollY);
    var reach = Math.sqrt(Math.pow(Math.max(ox, following.width - ox), 2) + Math.pow(Math.max(Math.abs(oy), Math.abs(oy - height)), 2)) + 8;
    wave.style.width = wave.style.height = (2 * reach) + 'px';
    wave.style.left = (ox - reach) + 'px';
    wave.style.top = (oy - reach) + 'px';
    void band.offsetWidth;
    band.style.transition = '';
    wave.style.transition = '';
    band.classList.add('is-on');
    checkBand();
    if (target.matches && target.matches('.page__content > h1')) {
      target.classList.remove('is-locating');
      void target.offsetWidth;
      target.classList.add('is-locating');
      setTimeout(function () { target.classList.remove('is-locating'); }, 1200);
    }
  }

  // The lens takes the click in (it shrinks a little and glows while the page travels to the section) and gives it out
  // when the page has arrived (a small swell, and the wave goes out of it).
  function charge() {
    var lens = document.querySelector('.nav-indicator');
    if (lens) { lens.classList.remove('is-released'); lens.classList.add('is-charging'); }
  }
  function release() {
    var lens = document.querySelector('.nav-indicator');
    if (!lens) { return; }
    lens.classList.remove('is-charging');
    lens.classList.remove('is-released');
    void lens.offsetWidth;
    lens.classList.add('is-released');
    setTimeout(function () { lens.classList.remove('is-released'); }, 900);
  }

  window.__reveal = {
    openingText: function () {
      var els = visibleOpeningText();
      els.forEach(hideNow);
      window.requestAnimationFrame(function () { showInOrder(els); });
    },
    // A link of the bar. What has not come in yet comes in once the page has arrived. What is on the page already stays where
    // it is, and a soft band appears behind the whole section for a moment, so that you can see how far the section reaches,
    // and the rule under its title is drawn again.
    arrive: function (target, origin) {
      var els = sectionOf(target);
      if (!els.length) { return; }
      var fresh = els.filter(function (el) { return !el.classList.contains('is-in'); });
      fresh.forEach(function (el) { seen.unobserve(el); });
      charge();
      quiet = true;
      var wanted = parseFloat(getComputedStyle(target).scrollMarginTop) || 0;
      var distance = Math.abs(target.getBoundingClientRect().top - wanted);
      var done = false, timer = 0;
      function go() {
        if (done) { return; }
        done = true;
        clearTimeout(timer);
        window.removeEventListener('scrollend', go);
        quiet = false;
        showInOrder(fresh);
        revealVisible();
        release();
        outline(target, els, origin);
      }
      if (distance < 3) { window.requestAnimationFrame(go); return; }
      if ('onscrollend' in window) { window.addEventListener('scrollend', go); }
      timer = setTimeout(go, Math.min(1400, 400 + distance * 0.35));
    }
  };
  root.setAttribute('data-reveal', 'on');
})();
</script>

<script>
// A fold (the patents, the note about the lab) opens and closes with its height instead of jumping, and its content
// fades with it. A press while it moves turns it around from where it is. Without the Web Animations API, or when the
// visitor wants less motion, the browser's own opening is left as it is.
(function () {
  if (!Element.prototype.animate || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) { return; }
  var ease = 'cubic-bezier(0.28, 0.11, 0.32, 1)';
  // the spring of _sass/_custom.scss ($spring), for a fold that opens; a browser without linear() keeps the plain curve
  var spring = 'linear(0, 0.04, 0.14, 0.274, 0.421, 0.565, 0.698, 0.812, 0.904, 0.975, 1.025, 1.058, 1.077, 1.083, 1.082, 1.074, 1.064, 1.052, 1.039, 1.028, 1.018, 1.01, 1.003, 0.999, 0.996, 0.994, 0.993, 0.993, 0.994, 0.994, 0.995, 0.996, 0.997, 0.998, 0.999, 1, 1)';
  var canSpring = window.CSS && CSS.supports && CSS.supports('transition-timing-function', 'linear(0, 1)');
  var folds = document.querySelectorAll('details');
  for (var i = 0; i < folds.length; i++) {
    (function (d) {
      var summary = d.querySelector('summary');
      if (!summary) { return; }
      var running = null, heading = null;
      summary.addEventListener('click', function (e) {
        e.preventDefault();
        var opening = heading === null ? !d.open : !heading;
        var from = d.getBoundingClientRect().height;
        if (running) { running.cancel(); running = null; }
        d.style.height = '';
        d.open = true;
        var openHeight = d.getBoundingClientRect().height;
        d.open = false;
        var closedHeight = d.getBoundingClientRect().height;
        d.open = true;
        heading = opening;
        d.style.overflow = 'hidden';
        var body = [].filter.call(d.children, function (c) { return c !== summary; });
        body.forEach(function (c) { c.animate({ opacity: opening ? [0, 1] : [1, 0] }, { duration: 420, easing: ease, fill: 'both' }); });
        // opening takes the spring (a small overshoot, then it settles); closing takes the plain curve, since a height cannot go below nothing
        running = d.animate({ height: [from + 'px', (opening ? openHeight : closedHeight) + 'px'] }, opening && canSpring ? { duration: 900, easing: spring } : { duration: 420, easing: ease });
        var mine = running;
        running.onfinish = function () {
          if (running !== mine) { return; }
          d.open = opening;
          d.style.overflow = '';
          running = null;
          heading = null;
          body.forEach(function (c) { c.getAnimations().forEach(function (a) { a.cancel(); }); });
        };
      });
    })(folds[i]);
  }
})();
</script>

<script>
// Refraction for the glass of the top bar. Real glass bends what is behind it, most at its rim. Chromium browsers (Chrome,
// Edge, Brave, Opera) can do the same: a filter (feDisplacementMap) moves each pixel of what lies under the bar by the
// amount that a map says, and the map is drawn here for the exact size of the bar: nothing in the middle, and towards the
// rim a push that grows to the edge, in the direction of the curve (round at the two ends of the pill, straight along the
// long sides). Other browsers keep the plain frosted glass of the style sheet. Nothing is done for those who ask for less
// transparency. The map is drawn again when the bar changes size.
(function () {
  var nav = document.querySelector('.nav-glass');
  if (!nav || !document.createElementNS || !/(Chrome|Chromium)\//.test(navigator.userAgent)) { return; }
  if (!(window.CSS && CSS.supports && CSS.supports('backdrop-filter', 'url(#glass-refraction)'))) { return; }
  if (window.matchMedia && window.matchMedia('(prefers-reduced-transparency: reduce)').matches) { return; }
  var NS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', '0'); svg.setAttribute('height', '0'); svg.setAttribute('aria-hidden', 'true');
  svg.style.position = 'absolute';
  // bend (displacement), then blur and saturate, all in the one filter: Chromium does not carry on with the filter functions
  // of the style sheet after a reference to an SVG filter
  svg.innerHTML = '<filter id="glass-refraction" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">' +
    '<feImage id="glass-map" x="0" y="0" width="1" height="1" preserveAspectRatio="none" result="map"/>' +
    '<feDisplacementMap in="SourceGraphic" in2="map" scale="26" xChannelSelector="R" yChannelSelector="G" result="bent"/>' +
    '<feGaussianBlur in="bent" stdDeviation="5" edgeMode="duplicate" result="soft"/>' +
    '<feColorMatrix in="soft" type="saturate" values="1.9"/></filter>';
  document.body.appendChild(svg);
  var image = svg.querySelector('#glass-map');
  var drawn = '';

  function draw() {
    var box = nav.getBoundingClientRect();
    var w = Math.round(box.width), h = Math.round(box.height);
    if (w < 40 || h < 20 || drawn === w + 'x' + h) { return; }
    drawn = w + 'x' + h;
    var canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    var picture = ctx.createImageData(w, h), px = picture.data;
    var radius = h / 2;                          // the bar is a pill
    var bezel = Math.min(radius * 0.95, 17);     // how far from the rim the glass bends the view
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var cx = Math.min(Math.max(x + 0.5, radius), w - radius);   // the nearest point of the straight middle part
        var dx = x + 0.5 - cx, dy = y + 0.5 - h / 2;
        var dist = Math.sqrt(dx * dx + dy * dy) || 0.0001;
        var depth = radius - dist;               // how far inside the rim this pixel is
        var vx = 0, vy = 0;
        if (depth < bezel) {
          var push = Math.pow(1 - Math.max(depth, 0) / bezel, 2.2);
          vx = -dx / dist * push; vy = -dy / dist * push;   // towards the middle of the glass
        }
        var i = (y * w + x) * 4;
        px[i] = Math.round(127.5 + 127 * vx); px[i + 1] = Math.round(127.5 + 127 * vy); px[i + 2] = 128; px[i + 3] = 255;
      }
    }
    ctx.putImageData(picture, 0, 0);
    image.setAttribute('width', w); image.setAttribute('height', h);
    image.setAttribute('href', canvas.toDataURL('image/png'));
    nav.classList.add('is-refracting');
  }

  draw();
  if (window.ResizeObserver) { new ResizeObserver(draw).observe(nav); } else { window.addEventListener('resize', draw); }
})();
</script>

<script>
// "second-year" in the opening text is counted when the site is built. This counts it again when the page is opened, so
// that it is right even if the site has not been rebuilt since September. data-start is the month the Ph.D. started
// (from _data/education.yml); data-words lists the words for year 1, 2, 3 ... (the Korean text uses the number itself).
(function () {
  var spans = document.querySelectorAll('.phd-year');
  var now = new Date();
  for (var i = 0; i < spans.length; i++) {
    var start = (spans[i].getAttribute('data-start') || '').split('-');
    if (start.length < 2) { continue; }
    var months = (now.getFullYear() - Number(start[0])) * 12 + (now.getMonth() + 1 - Number(start[1]));
    var year = Math.floor(months / 12) + 1;
    if (!(year >= 1)) { continue; }
    var words = spans[i].getAttribute('data-words');
    var text = words ? words.split('|')[year - 1] : String(year);
    if (text) { spans[i].textContent = text; }
  }
})();
</script>
