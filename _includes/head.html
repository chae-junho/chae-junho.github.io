<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% include seo.html %}
<link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
<link rel="shortcut icon" href="images/favicon.ico">
<link rel="manifest" href="images/site.webmanifest">
<meta name="theme-color" content="#ffffff">
<script>
  (function (root) {
    root.className = root.className.replace(/\bno-js\b/g, '') + ' js ';
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!('IntersectionObserver' in window) || reduced) {
      return;
    }
    root.className += ' js-reveal ';
    setTimeout(function () {
      if (!root.getAttribute('data-reveal')) {
        root.className = root.className.replace(/\bjs-reveal\b/g, '');
      }
    }, 3000);
  }(document.documentElement));
</script>
<link rel="stylesheet" href="assets/css/main.css?v={{ site.time | date: '%s' }}">
<script src="assets/js/main.js?v={{ site.time | date: '%s' }}" defer></script>
<base target="_blank">
